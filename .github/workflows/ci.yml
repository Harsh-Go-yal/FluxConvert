name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint || true


      - name: Build
        run: npm run build

  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint || echo "No lint script, skipping"

      - name: Test
        run: npm test || echo "No test script, skipping"

      - name: Build
        run: npm run build

  python-services:
    name: Python Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ocr-service
          - bg-remove-service
          - enhance-service
          - pdf-service
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping install"
          fi

      - name: Run tests (pytest if available)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest
          else
            echo "No pytest config or tests directory, skipping"
          fi

      - name: Basic import check
        run: |
          python -m py_compile main.py || echo "No main.py or compile failed"
