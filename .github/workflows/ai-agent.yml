name: 🤖 AI Agent Session

# Autonomous coding session: plan → Aider (DeepSeek) per task → tsc gate per task
# → next build gate → push `ai-dev` + keep one PR open → email report.
# See agent/README.md for setup and the email commands.

on:
  schedule:
    - cron: '0 */4 * * *'          # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      instruction:
        description: 'What should the agent do? Leave empty for an autonomous session.'
        required: false
        type: string
      session_minutes:
        description: 'Coding budget in minutes (default: AI_SESSION_MINUTES variable or 30)'
        required: false
        type: string
      reply_to:
        description: '(internal) email Message-ID the report should reply to'
        required: false
        type: string
      reply_subject:
        description: '(internal) email subject the report should reply to'
        required: false
        type: string

concurrency:
  group: ai-agent
  cancel-in-progress: false        # never kill a running session; new ones queue

permissions:
  contents: write
  pull-requests: write

jobs:
  session:
    name: 🤖 Plan → code → verify → deliver
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout (full history, PAT so pushes trigger CI on the PR)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            package-lock.json

      - name: Setup Python (for Aider)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install Aider
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r agent/requirements.txt
          aider --version

      - name: Cache web node_modules
        id: web-cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: web-nm-${{ runner.os }}-node22-${{ hashFiles('apps/web/package.json') }}

      - name: Install web dependencies
        if: steps.web-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Install orchestrator dependencies
        working-directory: agent
        run: npm ci --no-audit --no-fund

      - name: 🤖 Run session
        run: node agent/orchestrator/session.js
        env:
          # LLM
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # GitHub (PAT so that pushes/PRs trigger CI and gh can open PRs)
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Build
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Session tuning (repo Variables → Settings → Secrets and variables → Actions → Variables)
          AI_SESSION_MINUTES: ${{ inputs.session_minutes || vars.AI_SESSION_MINUTES || '30' }}
          AI_MAX_TASKS: ${{ vars.AI_MAX_TASKS || '6' }}
          AI_MAX_SESSION_USD: ${{ vars.AI_MAX_SESSION_USD || '1.5' }}
          AI_DELIVERY: ${{ vars.AI_DELIVERY || 'pr' }}        # pr | push
          AI_CODER_MODEL: ${{ vars.AI_CODER_MODEL || 'deepseek/deepseek-chat' }}
          # Instruction from the email inbox / manual dispatch
          AI_INSTRUCTION: ${{ inputs.instruction }}
          AI_REPLY_TO: ${{ inputs.reply_to }}
          AI_REPLY_SUBJECT: ${{ inputs.reply_subject }}
          # Email report (optional)
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ vars.MAIL_TO || 'harshgoyal0807@gmail.com' }}
          MAIL_OWNER: ${{ vars.MAIL_OWNER || 'harshgoyal0807@gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-session-${{ github.run_id }}
          path: agent/out
          retention-days: 14
          if-no-files-found: ignore
