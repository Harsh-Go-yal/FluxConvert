name: 🤖 AI Auto-Update Agent

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  workflow_dispatch:          # Manual trigger for testing

concurrency:
  group: ai-agent
  cancel-in-progress: false  # Never cancel an in-progress AI run

permissions:
  contents: write

jobs:
  ai-update:
    name: 🤖 AI Code Update
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 30 min coding + 10 min build + 10 min buffer

    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── Step 2: Prevent infinite loop ───────────────────────────────────────
      - name: Check if last commit was from AI bot
        id: check-bot
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          echo "Last commit author: $LAST_AUTHOR"
          echo "Last commit message: $LAST_MSG"
          if [[ "$LAST_AUTHOR" == "FluxConvert AI Bot" ]] || echo "$LAST_MSG" | grep -q "\[AI-update\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ Last commit was from AI bot — skipping to prevent infinite loop"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Proceeding with AI update cycle"
          fi

      # ── Step 3: Setup Node ──────────────────────────────────────────────────
      - name: Setup Node.js 22
        if: steps.check-bot.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      # ── Step 4: Install deps ─────────────────────────────────────────────────
      - name: Install dependencies
        if: steps.check-bot.outputs.skip != 'true'
        working-directory: apps/web
        run: npm install

      # ── Step 5: Collect TypeScript errors ───────────────────────────────────
      - name: Collect TypeScript errors
        if: steps.check-bot.outputs.skip != 'true'
        working-directory: apps/web
        run: |
          echo "🔍 Running TypeScript check..."
          npx tsc --noEmit 2>&1 | head -150 > /tmp/tsc-errors.txt || true
          echo "--- TSC errors captured ---"
          cat /tmp/tsc-errors.txt

      # ── Step 6: Collect build errors ────────────────────────────────────────
      - name: Collect build errors (pre-AI)
        if: steps.check-bot.outputs.skip != 'true'
        working-directory: apps/web
        continue-on-error: true
        run: |
          echo "🔨 Running initial build to capture errors..."
          npm run build 2>&1 | tail -150 > /tmp/build-errors.txt || true
          echo "--- Build errors captured ---"
          tail -30 /tmp/build-errors.txt
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # ── Step 7: Run AI Agent ─────────────────────────────────────────────────
      - name: 🤖 Run DeepSeek AI Agent
        if: steps.check-bot.outputs.skip != 'true'
        working-directory: apps/web
        run: node scripts/ai-agent.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # ── Step 8: Verify build passes after AI changes ─────────────────────────
      - name: Verify build after AI changes
        if: steps.check-bot.outputs.skip != 'true'
        id: verify-build
        working-directory: apps/web
        continue-on-error: true
        run: |
          echo "🔨 Verifying build after AI changes..."
          npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # ── Step 9: Commit & push (only if build passed) ─────────────────────────
      - name: Commit and push AI changes
        if: steps.check-bot.outputs.skip != 'true' && steps.verify-build.outcome == 'success'
        run: |
          git config user.name "FluxConvert AI Bot"
          git config user.email "ai-bot@fluxconvert.dev"

          # Check if there are any changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "ℹ️ No changes to commit this cycle — site is already optimal"
          else
            # Get the AI summary from the report
            SUMMARY=$(node -e "
              try {
                const r = require('./apps/web/scripts/ai-report.json');
                console.log((r.summary || 'Automated improvements').substring(0, 100));
              } catch(e) { console.log('Automated improvements'); }
            " 2>/dev/null || echo "Automated improvements")

            git add -A
            git commit -m "🤖 AI update: $SUMMARY [AI-update]"
            git push origin main
            echo "✅ Changes pushed to main — Vercel will deploy automatically!"
          fi

      # ── Step 10: Log skipped build ───────────────────────────────────────────
      - name: Log build failure (changes NOT pushed)
        if: steps.check-bot.outputs.skip != 'true' && steps.verify-build.outcome == 'failure'
        run: |
          echo "⚠️ AI-generated code failed the build check — changes were NOT pushed to main"
          echo "The site is safe. Changes will be retried next cycle with a corrected prompt."

      # ── Step 11: Write Job Summary (always runs) ─────────────────────────────
      - name: Write job summary
        if: steps.check-bot.outputs.skip != 'true' && always()
        run: |
          REPORT_FILE="apps/web/scripts/ai-report.json"
          BUILD_OUTCOME="${{ steps.verify-build.outcome }}"

          if [ -f "$REPORT_FILE" ]; then
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('$REPORT_FILE', 'utf-8'));
              const buildPassed = '$BUILD_OUTCOME' === 'success';
              const totalFiles = (report.allAppliedFiles || []).length;
              const pushed = buildPassed && totalFiles > 0;

              const lines = [
                '# 🤖 FluxConvert AI — 30-Minute Coding Session Report',
                '',
                '| Metric | Value |',
                '|--------|-------|',
                \`| ⏱️ Session time | ~30 minutes |\`,
                \`| 🔄 Rounds completed | \${report.totalRounds || 0} |\`,
                \`| 📁 Files modified | \${totalFiles} |\`,
                \`| 🐛 Bugs fixed | \${(report.allBugsFixed || []).length} |\`,
                \`| ✨ Improvements | \${(report.allFeatures || []).length} |\`,
                \`| 🔨 Build status | \${buildPassed ? '✅ Passed' : '❌ Failed'} |\`,
                \`| 🚀 Pushed to main | \${pushed ? '✅ Yes — Vercel deploying' : '❌ No'} |\`,
                '',
              ];

              if ((report.roundSummaries || []).length > 0) {
                lines.push('## 🔄 Round-by-Round Progress');
                (report.roundSummaries || []).forEach((s, i) => lines.push(\`**Round \${i+1}:** \${s}\`));
                lines.push('');
              }

              if ((report.allBugsFixed || []).length > 0) {
                lines.push('## 🐛 All Bugs Fixed');
                (report.allBugsFixed || []).forEach(b => lines.push(\`- \${b}\`));
                lines.push('');
              }

              if ((report.allFeatures || []).length > 0) {
                lines.push('## ✨ All Improvements');
                (report.allFeatures || []).forEach(f => lines.push(\`- \${f}\`));
                lines.push('');
              }

              if ((report.allAppliedFiles || []).length > 0) {
                lines.push('## 📁 Files Modified');
                (report.allAppliedFiles || []).forEach(f => lines.push(\`- \\\`\${f}\\\`\`));
                lines.push('');
              }

              if (!buildPassed) {
                lines.push('## ⚠️ Build failed — changes NOT pushed to main');
                lines.push('The live site is safe. AI will retry next cycle.');
              }

              process.stdout.write(lines.join('\n'));
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🤖 AI Auto-Update" >> $GITHUB_STEP_SUMMARY
            echo "No report file found this cycle." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Skipped (bot commit)
        if: steps.check-bot.outputs.skip == 'true'
        run: |
          echo "# 🤖 AI Auto-Update — Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Last commit was from the AI bot. Skipping this cycle to prevent a loop." >> $GITHUB_STEP_SUMMARY
