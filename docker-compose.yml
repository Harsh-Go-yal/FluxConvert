version: '3.8'

services:
  # Reverse Proxy (NGINX)
  reverse-proxy:
    build: ./reverse-proxy
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks:
      - flux_network
    restart: unless-stopped

  # Frontend (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - flux_network
    restart: unless-stopped

  # API Gateway (NestJS)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - OCR_SERVICE_URL=http://ocr-service:8001
      - BG_REMOVE_URL=http://bg-remove-service:8002
      - ENHANCE_SERVICE_URL=http://enhance-service:8003
      - PDF_SERVICE_URL=http://pdf-service:8004
    depends_on:
      - ocr-service
      - bg-remove-service
      - enhance-service
      - pdf-service
    networks:
      - flux_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Microservices
  ocr-service:
    build: ./apps/ocr-service
    networks:
      - flux_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bg-remove-service:
    build: ./apps/bg-remove-service
    networks:
      - flux_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  enhance-service:
    build: ./apps/enhance-service
    networks:
      - flux_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  pdf-service:
    build: ./apps/pdf-service
    networks:
      - flux_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  flux_network:
    driver: bridge
